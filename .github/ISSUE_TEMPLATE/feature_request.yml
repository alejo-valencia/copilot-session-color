name: Feature request
description: Propose a customization or extension.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: extension-area
    attributes:
      label: Extension area
      options:
        - Theme or palette
        - Decoration
        - Statusline segment
        - Installer or upgrade
        - Cross-platform support
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and compatibility considerations
